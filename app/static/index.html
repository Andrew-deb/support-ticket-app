<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Internal support ticket management system backed by Lakebase">
    <title>Support Ticket App</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ========== HEADER ========== -->
    <header class="app-header">
        <div class="header-content">
            <div class="logo-group">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 5v2"/>
                        <path d="M15 11v2"/>
                        <path d="M15 17v2"/>
                        <path d="M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z"/>
                    </svg>
                </div>
                <h1>Support Tickets</h1>
            </div>
            <button id="btn-new-ticket" class="btn btn-primary" onclick="openCreateModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                New Ticket
            </button>
        </div>
    </header>

    <!-- ========== STATS BAR ========== -->
    <section class="stats-bar" id="stats-bar">
        <div class="stat-card">
            <span class="stat-number" id="stat-total">0</span>
            <span class="stat-label">Total</span>
        </div>
        <div class="stat-card stat-open">
            <span class="stat-number" id="stat-open">0</span>
            <span class="stat-label">Open</span>
        </div>
        <div class="stat-card stat-progress">
            <span class="stat-number" id="stat-progress">0</span>
            <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-card stat-resolved">
            <span class="stat-number" id="stat-resolved">0</span>
            <span class="stat-label">Resolved</span>
        </div>
    </section>

    <!-- ========== FILTER TABS ========== -->
    <section class="filter-bar">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all', this)">All</button>
        <button class="filter-tab" data-filter="open" onclick="setFilter('open', this)">Open</button>
        <button class="filter-tab" data-filter="in_progress" onclick="setFilter('in_progress', this)">In Progress</button>
        <button class="filter-tab" data-filter="resolved" onclick="setFilter('resolved', this)">Resolved</button>
    </section>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="main-content">
        <!-- Ticket List -->
        <div class="ticket-list" id="ticket-list">
            <div class="loading-spinner" id="loading">
                <div class="spinner"></div>
                <p>Loading tickets...</p>
            </div>
        </div>

        <!-- Ticket Detail Panel (hidden by default) -->
        <aside class="ticket-detail" id="ticket-detail" style="display:none;">
            <div class="detail-header">
                <button class="btn-back" onclick="closeDetail()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
                    Back
                </button>
                <div class="detail-status-group">
                    <select id="detail-status-select" class="status-select" onchange="updateTicketStatus()">
                        <option value="open">Open</option>
                        <option value="in_progress">In Progress</option>
                        <option value="resolved">Resolved</option>
                    </select>
                    <button class="btn btn-danger" onclick="deleteTicket()" title="Delete ticket">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        Delete
                    </button>
                </div>
            </div>

            <div class="detail-info">
                <h2 id="detail-title"></h2>
                <div class="detail-meta">
                    <span id="detail-created-by"></span>
                    <span id="detail-created-at"></span>
                </div>
            </div>

            <div class="messages-section">
                <h3>Messages</h3>
                <div class="messages-list" id="messages-list"></div>

                <form class="message-form" id="message-form" onsubmit="submitMessage(event)">
                    <input type="text" id="msg-author" placeholder="Your name or email" required>
                    <textarea id="msg-text" placeholder="Type your message..." rows="3" required></textarea>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </aside>
    </main>

    <!-- ========== CREATE TICKET MODAL ========== -->
    <div class="modal-overlay" id="create-modal" style="display:none;" onclick="closeCreateModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>Create New Ticket</h2>
                <button class="btn-close" onclick="closeCreateModal()">&times;</button>
            </div>
            <form id="create-ticket-form" onsubmit="submitNewTicket(event)">
                <div class="form-group">
                    <label for="create-title">Title</label>
                    <input type="text" id="create-title" placeholder="Describe the issue..." required>
                </div>
                <div class="form-group">
                    <label for="create-author">Your Name / Email</label>
                    <input type="text" id="create-author" placeholder="e.g. john@company.com" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-ticket">Create Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========== TOAST NOTIFICATION ========== -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
